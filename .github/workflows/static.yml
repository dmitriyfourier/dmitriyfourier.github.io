name: Build Eleventy
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # eleventy-img skips images that already exist in the output folder,
      # so restoring them avoids re-encoding every image on each deploy.
      # File names contain a hash of the source and options, so a stale
      # entry is never reused. OG previews have fixed names and are rebuilt.
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: |
            _site/assets/img
            !_site/assets/img/og
          key: images-${{ runner.os }}-${{ hashFiles('src/assets/img/**', '.eleventy.js') }}
          restore-keys: |
            images-${{ runner.os }}-

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          #publish_dir is the folder on the docker instance which eleventy builds the pages to.
          #it is not the docs folder in the repository
          publish_dir: _site
          #publish_branch is the branch in the repository.
          #this is where you need to point GitHub pages
          publish_branch: gh-pages
